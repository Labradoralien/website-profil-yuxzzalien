<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090914">
<title>Yuxzzalien | My Profile</title><style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 15px;
    font-family: 'Segoe UI', sans-serif;
    color: white;

    background:
        radial-gradient(circle at top, #30205a, transparent 45%),
        linear-gradient(145deg, #090914, #151329, #080812);
}

/* PROFILE CARD */

.profile {
    width: 100%;
    max-width: 420px;
    padding: 35px 24px 25px;
    text-align: center;
    border-radius: 28px;

    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.12);

    box-shadow: 0 20px 70px rgba(0,0,0,.5);
    backdrop-filter: blur(20px);

    animation: muncul .8s ease;
}

/* ANIMATION */

@keyframes muncul {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* PROFILE PHOTO */

.avatar {
    width: 110px;
    height: 110px;
    margin: 0 auto 18px;

    border-radius: 50%;
    overflow: hidden;

    border: 4px solid rgba(255,255,255,.2);
    box-shadow: 0 0 30px rgba(147,51,234,.5);
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* NAME */

h1 {
    font-size: 27px;
    letter-spacing: .5px;
}

.bio {
    margin: 10px auto 28px;
    max-width: 300px;

    color: #aaa8c3;
    font-size: 14px;
    line-height: 1.7;
}

/* BUTTONS */

.links {
    display: grid;
    gap: 14px;
}

.btn {
    width: 100%;
    min-height: 57px;
    padding: 15px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    border-radius: 16px;

    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;

    border: 1px solid rgba(255,255,255,.13);
    background: rgba(255,255,255,.07);

    cursor: pointer;
    transition: .3s;
}

.btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(0,0,0,.3);
}

.icon {
    font-size: 21px;
}

/* TIKTOK */

.tiktok {
    background: linear-gradient(
        100deg,
        rgba(0,220,210,.2),
        rgba(255,45,85,.2)
    );
}

/* SHOPEE */

.shopee {
    background: linear-gradient(
        100deg,
        rgba(238,77,45,.4),
        rgba(255,145,77,.25)
    );
}

/* DONATE */

.donate {
    background: linear-gradient(
        100deg,
        rgba(139,92,246,.35),
        rgba(236,72,153,.25)
    );
}

/* FOOTER */

.footer {
    margin-top: 27px;
    color: #77758f;
    font-size: 12px;
}

/* QR MODAL */

.modal {
    position: fixed;
    inset: 0;
    padding: 20px;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.85);
    z-index: 10;
}

.modal.open {
    display: flex;
}

.modal-card {
    width: 100%;
    max-width: 330px;
    padding: 25px;

    text-align: center;

    border-radius: 23px;
    background: white;
    color: #17172a;

    animation: muncul .3s ease;
}

.modal-card h2 {
    margin-bottom: 18px;
}

.modal-card img {
    width: 100%;
    max-width: 230px;
    aspect-ratio: 1;
    object-fit: contain;
}

.modal-card p {
    margin-top: 15px;
    font-size: 13px;
    color: #666;
}

.close {
    margin-top: 20px;
    padding: 11px 25px;

    border: none;
    border-radius: 12px;

    color: white;
    background: #17172a;

    font-weight: bold;
    cursor: pointer;
}

/* MOBILE */

@media (max-width: 400px) {
    .profile {
        padding: 30px 18px 23px;
    }

    h1 {
        font-size: 24px;
    }
}
</style></head><body><main class="profile"><!-- FOTO PROFIL -->
<div class="avatar">
    <img
        src="https://files.catbox.moe/6stv65.png"
        alt="Foto Profil Yuxzzalien"
    >
</div>

<!-- NAMA -->
<h1>Yuxzzalien</h1>

<!-- BIO -->
<p class="bio">
    Selamat datang di halaman profil saya 👋<br>
    Follow akun saya dan dukung aktivitas saya
    melalui tombol di bawah.
</p>

<!-- DAFTAR LINK -->
<nav class="links">

    <!-- TIKTOK PERTAMA -->
    <a class="btn tiktok"
       href="https://www.tiktok.com/@yuxzzalien?_r=1&_t=ZS-9BHLReojQiC"
       target="_blank"
       rel="noopener noreferrer">
        <span class="icon">♪</span>
        Akun TikTok Pertama
    </a>

    <!-- TIKTOK KEDUA -->
    <a class="btn tiktok"
       href="https://www.tiktok.com/@noichever_?_r=1&_t=ZS-9BHM48sH4g0"
       target="_blank"
       rel="noopener noreferrer">
        <span class="icon">♪</span>
        Akun TikTok Kedua
    </a>

    <!-- SHOPEE -->
    <a class="btn shopee"
       href="https://id.shp.ee/xhbuhxas?fromSource=copy_link&smtt=0.0.9"
       target="_blank"
       rel="noopener noreferrer">
        <span class="icon">🛍️</span>
        Akun Shopee
    </a>

    <!-- SAWERIA -->
    <a class="btn donate"
       href="https://saweria.co/yuxzz"
       target="_blank"
       rel="noopener noreferrer">
        <span class="icon">💜</span>
        Donate via Saweria
    </a>

    <!-- QR DONASI -->
    <button class="btn donate" onclick="openQR()">
        <span class="icon">▦</span>
        Donate via QR
    </button>

</nav>

<!-- FOOTER -->
<div class="footer">
    ✨ Terima kasih sudah berkunjung ✨
</div>

</main><!-- MODAL QR --><div class="modal" id="qrModal" onclick="closeQR(event)"><div class="modal-card">

    <h2>Donate via QR</h2>

    <img
        src="https://files.catbox.moe/ekimf6.jpeg"
        alt="QR Donasi"
    >

    <p>Scan QR untuk memberikan dukungan 🙏</p>

    <button class="close" onclick="closeQR()">
        Tutup
    </button>

</div>

</div><script>

// BUKA QR
function openQR() {
    document.getElementById("qrModal")
        .classList.add("open");
}

// TUTUP QR
function closeQR(event) {
    if (
        !event ||
        event.target.id === "qrModal" ||
        event.target.tagName === "BUTTON"
    ) {
        document.getElementById("qrModal")
            .classList.remove("open");
    }
}

// TUTUP DENGAN TOMBOL ESCAPE
document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
        closeQR();
    }
});

</script></body>
</html>
